name: Build ETERNAL IDLE app

# main 푸시 = 설치 파일만 빌드 (Actions 아티팩트로 받아서 직접 확인용, 자동 업데이트 안 됨)
# v* 태그 푸시 = Release 생성 → 설치된 앱 자동 업데이트. 태그는 package.json 버전과 같아야 함.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # GitHub Release 생성/업로드용

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows installer
        run: npm run build:win

      - name: Read app version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.ver.outputs.version }}" ]; then
            echo "태그(${GITHUB_REF_NAME})와 package.json 버전(v${{ steps.ver.outputs.version }})이 달라서 배포를 중단합니다."; exit 1
          fi

      - name: Create GitHub Release with .exe + latest.yml (auto-updater)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: true

      - name: Upload .exe artifact (백업용)
        uses: actions/upload-artifact@v4
        with:
          name: eternal-idle-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 90
