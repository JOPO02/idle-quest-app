name: Build IDLE QUEST

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # GitHub Release 생성/업로드용

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows installer + publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Upload .exe artifact (백업용)
        uses: actions/upload-artifact@v4
        with:
          name: idle-quest-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 90
